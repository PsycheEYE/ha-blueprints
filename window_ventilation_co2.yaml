blueprint:
  name: CO2-Based Window Ventilation
  description: >-
    Automatically open/close a window based on CO2 levels.
    Includes forced ventilation via timer and home-mode safety check.
    Edit the entity_ids below after importing.
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  input:
    co2_sensor:
      name: CO2 sensor
      selector:
        entity:
          domain: sensor
          device_class: carbon_dioxide
    open_threshold:
      name: Open window above (ppm)
      default: 800
      selector:
        number: { min: 400, max: 2000, step: 50, unit_of_measurement: "ppm", mode: slider }
    close_threshold:
      name: Close window below (ppm)
      default: 550
      selector:
        number: { min: 300, max: 1500, step: 50, unit_of_measurement: "ppm", mode: slider }
    trigger_delay:
      name: Trigger delay
      default: "00:01:00"
      selector:
        duration: {}
    away_sensor:
      name: Away mode sensor
      selector:
        entity:
          domain: [input_select, binary_sensor, input_boolean]
    away_state:
      name: Away state value
      default: "on"
      selector:
        text: {}

mode: restart

triggers:
  - id: open
    trigger: numeric_state
    entity_id: !input co2_sensor
    for: !input trigger_delay
    above: !input open_threshold
  - id: close
    trigger: numeric_state
    entity_id: !input co2_sensor
    for: !input trigger_delay
    below: !input close_threshold
  - id: unavailable
    trigger: state
    entity_id: !input co2_sensor
    to: "unavailable"
    for: !input trigger_delay
  - id: timer_started
    trigger: timer.started
    entity_id: timer.forced_ventilation_timeout
  - id: timer_expired
    trigger: timer.finished
    entity_id: timer.forced_ventilation_timeout
  - id: window_closed
    trigger: state
    entity_id: cover.bedroom_window_opener
    to: "closed"

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: ["open"]
          - condition: not
            conditions:
              - condition: state
                entity_id: !input away_sensor
                state: ["!input away_state"]
        sequence:
          - action: cover.open_cover
            target:
              entity_id: cover.bedroom_window_opener

      - conditions:
          - condition: trigger
            id: ["close"]
        sequence:
          - action: cover.close_cover
            target:
              entity_id: cover.bedroom_window_opener

      - conditions:
          - condition: trigger
            id: ["unavailable"]
        sequence:
          - action: cover.close_cover
            target:
              entity_id: cover.bedroom_window_opener

      - conditions:
          - condition: trigger
            id: ["timer_started"]
        sequence:
          - action: cover.open_cover
            target:
              entity_id: cover.bedroom_window_opener

      - conditions:
          - condition: trigger
            id: ["timer_expired"]
        sequence:
          - action: cover.close_cover
            target:
              entity_id: cover.bedroom_window_opener

      - conditions:
          - condition: trigger
            id: ["window_closed"]
          - condition: not
            conditions:
              - condition: state
                entity_id: timer.forced_ventilation_timeout
                state: "idle"
        sequence:
          - action: timer.cancel
            target:
              entity_id: timer.forced_ventilation_timeout
